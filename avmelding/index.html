<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meld deg av</title>
<meta name="description" content="Meld deg av e-post og SMS fra Min dag på me.voteapp.">
<style>
:root{--bg:#f3f6f6;--surface:#fff;--ink:#14232b;--muted:#56666d;--line:#d3dedd;--accent:#1f8a6d;--accent-ink:#fff;--err:#a3261b;--focus:#d98a1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e171b;--surface:#16232a;--ink:#e6eef0;--muted:#9db0b6;--line:#2a3d45;--accent:#43c39b;--accent-ink:#06231a;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171b;--surface:#16232a;--ink:#e6eef0;--muted:#9db0b6;--line:#2a3d45;--accent:#43c39b;--accent-ink:#06231a;--err:#ff8a7a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:1.5rem;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 8px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#msg{font-weight:600;min-height:1.5em}
#msg.err{color:var(--err)}
.muted{color:var(--muted);font-size:14px}
a{color:inherit}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Meld deg av</h1>
<p id="intro">Vil du slutte å få meldinger fra Min dag? Velg under.</p>
<div class="row" id="buttons">
  <button type="button" class="primary" id="b-email">Ingen flere e-poster med tips og nytt</button>
  <button type="button" id="b-all">Ingen e-post og ingen SMS</button>
</div>
<p id="msg" role="status" aria-live="polite"></p>
<p class="muted">Meldinger om innlogging og betaling får du fortsatt så lenge du har konto. Vil du slette kontoen helt, logger du inn i <a href="/portal/">portalen</a> og velger «Slett kontoen min og alle data».</p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../portal/supabase-public.js"></script>
<script>
(function(){
  var msg = document.getElementById("msg"), btns = document.getElementById("buttons");
  function say(t, err){ msg.textContent = t; msg.className = err ? "err" : ""; }
  var t = (location.search.match(/[?&]t=([0-9a-fA-F-]{36})/) || [])[1];
  if(!t){ btns.hidden = true; say("Lenken mangler en del. Bruk lenken nederst i e-posten du fikk.", true); return; }
  var CFG = window.ME_SUPABASE || {};
  if(!window.supabase || !CFG.url){ say("Siden kunne ikke lastes. Prøv igjen om litt.", true); return; }
  var sb = window.supabase.createClient(CFG.url, CFG.publishable, {auth:{persistSession:false}});
  function go(kind){
    say("Lagrer...");
    sb.rpc("unsubscribe", {p_token: t, p_kind: kind}).then(function(r){
      if(r.error || !r.data || r.data.ok !== true){ say("Fant ikke avmeldingen. Lenken kan være gammel. Logg inn i portalen og ta bort krysset der.", true); return; }
      btns.hidden = true;
      document.getElementById("intro").textContent = "Ferdig.";
      say(kind === "all" ? "Du får ingen flere e-poster med tips og nytt, og ingen SMS fra Min dag." : "Du får ingen flere e-poster med tips og nytt fra Min dag.");
    });
  }
  document.getElementById("b-email").addEventListener("click", function(){ go("email"); });
  document.getElementById("b-all").addEventListener("click", function(){ go("all"); });
})();
</script>
</body>
</html>
