<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/lib/sprak.js?v=2026-11-22j" data-del="liste"></script>
<meta name="robots" content="noindex">
<title>Bekreft påmeldingen</title>
<meta name="description" content="Bekreft påmeldingen til e-postlisten for Min dag.">
<link rel="stylesheet" href="stil.css?v=2026-11-21">
</head>
<body>
<main>
<h1>Bekreft påmeldingen</h1>
<div class="card" id="start">
<p>Trykk på knappen for å bekrefte at du vil være med. Først da kommer du på listen.</p>
<p><button id="bekreft" type="button">Ja, meld meg på</button></p>
<p class="small">Ombestemmer du deg, kan du melde deg av med ett klikk nederst i hver e-post.</p>
</div>
<div class="card" id="svar" role="status" aria-live="polite" hidden></div>
<p class="small"><a href="/spill/">Til Spill for familie og venner</a> · <a href="/">Til Min dag</a> · <a href="personvern.html">Personvern</a></p>
</main>
<script>
(function () {
  var t = new URLSearchParams(location.search).get("t") || "";
  var start = document.getElementById("start"), svar = document.getElementById("svar"), knapp = document.getElementById("bekreft");
  function vis(html, ok) { svar.innerHTML = html; svar.className = "card " + (ok ? "ok" : "feil"); svar.hidden = false; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  if (!/^[0-9a-f-]{36}$/i.test(t)) { start.hidden = true; vis("<p>Lenken mangler en del. Åpne lenken fra e-posten på nytt, eller meld deg på igjen.</p>", false); return; }
  knapp.addEventListener("click", function () {
    knapp.disabled = true; knapp.textContent = "Bekrefter...";
    fetch("https://xprcbxubejpazmdbpsmy.supabase.co/functions/v1/liste", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ handling: "bekreft", t: t })
    }).then(function (r) { return r.json(); }).then(function (s) {
      start.hidden = true;
      if (s && s.ok) {
        var valg = [];
        if (s.nyheter) valg.push("<li>Nytt fra Min dag på e-post, høyst to ganger i måneden.</li>");
        if (s.testpilot) valg.push("<li>Testpilot: du får én måned gratis når betalingen er på plass. Vi tar kontakt når det er noe nytt å prøve.</li>");
        vis("<p><b>Takk" + (s.navn ? ", " + esc(s.navn) : "") + "! Du er med.</b></p><ul>" + valg.join("") + "</ul>" +
            "<p class=\"small\">Vil du ikke være med likevel? <a href=\"avmeld.html?t=" + esc(s.avmeld) + "\">Meld meg av</a>.</p>", true);
      } else if (s && s.grunn === "utlopt") {
        vis("<p>Lenken er for gammel. Meld deg på igjen, så får du en ny.</p><p><a class=\"knapp\" href=\"/spill/#h-testpilot\">Meld meg på igjen</a></p>", false);
      } else {
        vis("<p>Vi fant ikke denne påmeldingen. Kanskje du har fått en nyere lenke? Bruk den nyeste e-posten, eller meld deg på igjen.</p>", false);
      }
    }).catch(function () {
      knapp.disabled = false; knapp.textContent = "Ja, meld meg på";
      vis("<p>Fikk ikke kontakt. Sjekk nettet og prøv igjen.</p>", false);
    });
  });
})();
</script>
<script src="/lib/sprakmeny.js?v=2026-11-22" defer></script>
</body>
</html>
